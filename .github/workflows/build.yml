name: Build Mac App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions: 
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: bash desktop/build.sh

      - name: Zip for distribution
        run: cd desktop && zip -r -y TheJourney-mac.zip TheJourney.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheJourney-mac
          path: desktop/TheJourney-mac.zip

      - name: Create release and upload
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber desktop/TheJourney-mac.zip
          else
            gh release create "$TAG" --title "$TAG" --notes "Sticky Board $TAG" desktop/TheJourney-mac.zip
          fi
