name: Build Mac App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: bash desktop/build.sh

      - name: Zip for distribution
        run: cd desktop && zip -r -y TheJourney-mac.zip TheJourney.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheJourney-mac
          path: desktop/TheJourney-mac.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: desktop/TheJourney-mac.zip
