<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journey · 便利贴白板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2e9; --ink:#23272f; --muted:#6b7280; --card:#fffdf6;
  --shadow:0 1px 0 rgba(35,39,47,.06),0 12px 28px -12px rgba(35,39,47,.22);
  --shadow-lg:0 2px 0 rgba(35,39,47,.06),0 24px 48px -16px rgba(35,39,47,.28);
  --blue:#cfe4ff; --pink:#ffd9e1; --green:#c9f2d4;
  --yellow:#fff3a3; --purple:#ddd0ff; --cyan:#b8eef7;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);overflow:hidden;
  font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--paper);
}
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab}
#viewport.panning{cursor:grabbing}
#viewport::before{
  content:"";position:absolute;inset:-2000px;
  background:
    linear-gradient(rgba(35,39,47,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(35,39,47,.055) 1px,transparent 1px),
    linear-gradient(rgba(35,39,47,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(35,39,47,.09) 1px,transparent 1px),
    var(--paper);
  background-size:28px 28px,28px 28px,140px 140px,140px 140px,auto;
}
#world{position:absolute;left:0;top:0;width:2400px;height:1600px;transform-origin:0 0}
#world::after{content:"";position:absolute;left:0;top:0;width:2400px;height:1600px;pointer-events:none;border:2px solid rgba(35,39,47,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
#sidebar{
  position:fixed;left:14px;top:14px;bottom:14px;width:248px;z-index:60;
  background:rgba(255,253,246,.94);backdrop-filter:blur(10px);
  border:1.5px solid rgba(35,39,47,.85);border-radius:18px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding:16px 12px;
}
#sidebar h1{font-family:"Caveat",cursive;font-size:34px;margin:0 6px;line-height:1}
#sidebar .sub{font-size:11.5px;color:var(--muted);margin:2px 6px 12px}
#boardList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.board{
  display:flex;align-items:center;gap:8px;border:1px solid transparent;
  border-radius:12px;padding:9px 10px;cursor:pointer;font-size:13.5px;font-weight:600;
}
.board:hover{background:#f3eee1}
.board.active{background:#23272f;color:#fff}
.board .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .ct{font-size:11px;font-weight:700;background:rgba(127,127,127,.25);
  border-radius:999px;padding:2px 8px}
.board .bx{border:0;background:transparent;cursor:pointer;font-size:13px;
  color:inherit;opacity:0;padding:2px 4px;border-radius:6px}
.board:hover .bx{opacity:.7}
.board .bx:hover{opacity:1;background:rgba(127,127,127,.3)}
#newBoard{
  margin-top:10px;border:1.5px dashed rgba(35,39,47,.4);border-radius:12px;
  background:transparent;padding:10px;font-size:13px;font-weight:700;cursor:pointer;
}
#newBoard:hover{background:#f3eee1}
#sidebar .foot{font-size:11px;color:var(--muted);margin:10px 6px 0;line-height:1.6}
.side-head{display:flex;align-items:flex-start;justify-content:space-between;margin:0 2px}
#collapseBtn{border:1px solid rgba(35,39,47,.3);background:#fff;border-radius:9px;width:28px;height:28px;
  cursor:pointer;font-size:15px;line-height:1;color:var(--ink);flex:none;margin-top:4px}
#collapseBtn:hover{background:#f3eee1}
#sidebar{transition:transform .2s ease-out}
body.side-hidden #sidebar{transform:translateX(calc(-100% - 18px))}
.zoom{transition:left .2s ease-out}
body.side-hidden .zoom{left:16px}
#sideTab{position:fixed;left:0;top:44%;z-index:60;width:26px;height:64px;border-radius:0 12px 12px 0;
  background:rgba(255,253,246,.96);border:1.5px solid rgba(35,39,47,.85);border-left:0;cursor:pointer;
  font-size:15px;color:var(--ink);box-shadow:var(--shadow);
  transform:translateX(-110%);transition:transform .2s ease-out}
body.side-hidden #sideTab{transform:translateX(0)}
#sideTab:hover{background:#f3eee1}
@media (max-width:760px){
  #collapseBtn,#sideTab{display:none}
  body.side-hidden #sidebar{transform:none}
}
#toolbar{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:55;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border:1px solid rgba(35,39,47,.12);border-radius:14px;padding:6px 8px;
  box-shadow:var(--shadow);max-width:calc(100vw - 40px);max-height:84px;overflow-y:auto;
}
#toolbar .bname{font-family:"Caveat",cursive;font-size:23px;padding:0 8px;
  max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#searchBox{width:150px;border:1px solid rgba(35,39,47,.2);border-radius:9px;padding:8px 10px;font:12px inherit;background:#fff}
.toolBtn{border:1px solid rgba(35,39,47,.25);border-radius:9px;background:#fff;font-weight:700;font-size:12px;padding:8px 10px;cursor:pointer;white-space:nowrap;flex:none}
.toolBtn:hover{background:#f3eee1}
#importPick{display:none}
#toolGroup{display:flex;gap:4px;border-left:1px solid #ddd;padding-left:6px}.toolBtn.active{background:#23272f;color:#fff}
#inspector{position:fixed;right:14px;top:90px;width:280px;max-height:calc(100vh - 110px);overflow:auto;z-index:65;background:rgba(255,253,246,.98);border:1px solid rgba(35,39,47,.2);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px;display:none}.ins-title{font-weight:700;font-size:14px;margin-bottom:8px}.ins-grid{display:grid;gap:7px}.ins-grid label{font-size:11px;color:var(--muted)}.ins-grid input,.ins-grid select,.ins-grid textarea{width:100%;padding:7px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;font:12px inherit;box-sizing:border-box}.ins-grid textarea{resize:vertical;min-height:50px}.ins-grid .check-label{display:flex;align-items:center;gap:7px}.ins-grid .check-label input{width:auto}.ins-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.ins-actions button{flex:1;padding:7px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;cursor:pointer;min-width:62px}.ins-actions button:hover{background:#f3eee1}.subtask-editor{display:grid;gap:5px;margin-top:5px}.subtask-row{display:grid;grid-template-columns:18px 1fr 70px 24px;gap:4px;align-items:center}.subtask-row input[type=checkbox]{width:15px;height:15px}.subtask-row input[type=text],.subtask-row select{padding:5px;font-size:11px}.subtask-row button{border:0;background:transparent;color:#777;cursor:pointer;padding:3px}.subtask-row button:hover{color:#b42318}.subtask-add{display:flex;gap:5px;margin-top:5px}.subtask-add input{flex:1}.subtask-add button{border:1px solid #ccd1d8;border-radius:7px;background:#fff;padding:5px 8px;cursor:pointer}
.elm-actions{display:none}.elm-actions.open{display:grid;gap:7px}.elm-actions label{font-size:11px;color:var(--muted)}.elm-actions input,.elm-actions select{width:100%;padding:7px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;font:12px inherit;box-sizing:border-box}.elm-actions .check-label{display:flex;align-items:center;gap:7px}.elm-actions .check-label input{width:auto}
.shape{position:absolute;border:2px solid #23272f;background:rgba(255,255,255,.35);border-radius:8px}.shape.ellipse{border-radius:50%}.connector{position:absolute;height:3px;background:#23272f;transform-origin:left center}.drawstroke{position:absolute;pointer-events:none}
.shape table{width:100%;height:100%;border-collapse:collapse;font-size:12px;background:rgba(255,255,255,.65)}.shape td{border:1px solid #777;padding:5px}.shape td[contenteditable=true]{background:#fff}
.selection-box{position:absolute;border:1px dashed #2563eb;background:rgba(37,99,235,.12);pointer-events:none;z-index:1000}.selected-outline,.shape.sel,.connector.sel,.drawstroke.sel{outline:3px solid #2563eb;outline-offset:3px}.connector .arrowhead{position:absolute;right:-2px;top:-8px;font-size:20px}.trend{display:flex;align-items:flex-end;gap:5px;height:130px;padding:8px;border-bottom:1px solid #ccc}.trend i{display:block;flex:1;background:#91b8e8;min-height:3px;border-radius:4px 4px 0 0;position:relative}.trend i b{position:absolute;bottom:-18px;left:50%;font-size:9px;transform:translateX(-50%);font-weight:400}

.muted{color:var(--muted);font-size:11px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;align-items:start}
.kan-col{background:rgba(35,39,47,.055);border-radius:10px;padding:8px;min-height:220px}
.kan-col.over{outline:2px dashed #2563eb;outline-offset:-2px}
.kan-col h4{margin:2px 2px 8px;font-size:12px;color:var(--muted)}
.kan-card{border-radius:8px;padding:8px 9px;margin-bottom:6px;font-size:12px;font-weight:600;cursor:grab;border:1px solid rgba(35,39,47,.15)}
.kan-card small{display:block;font-weight:400;color:rgba(35,39,47,.6);margin-top:2px}
.shape-label{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;padding:6px;text-align:center;pointer-events:none;overflow:hidden}


.toast{position:fixed;right:20px;bottom:20px;z-index:150;max-width:360px;padding:11px 15px;border-radius:10px;background:#23272f;color:#fff;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
.richbody{font-size:12.5px;line-height:1.6;color:rgba(35,39,47,.82);margin:0;outline:none;border-radius:4px;min-height:1em;word-break:break-word}
.richbody:focus{background:rgba(255,255,255,.55)}
.richbody p{margin:0 0 7px}.richbody p:last-child{margin-bottom:0}
.richbody h4{font-size:15px;line-height:1.3;margin:0 0 7px}.richbody ul,.richbody ol{margin:4px 0 7px;padding-left:20px}.richbody li{margin:2px 0}
.richbody blockquote{margin:5px 0;padding:3px 9px;border-left:3px solid rgba(35,39,47,.35);background:rgba(255,255,255,.28);border-radius:0 5px 5px 0}
.richbody code{font-family:ui-monospace,monospace;font-size:11px;background:rgba(255,255,255,.5);padding:1px 4px;border-radius:4px}
.bodyedit{width:100%;min-height:120px;font:inherit;line-height:1.5;padding:8px 10px;border:1px solid #ccd1d8;border-radius:6px;background:#fcfbf3;resize:vertical;color:inherit}
.richbody pre{margin:7px 0;padding:9px 10px;overflow:auto;background:rgba(35,39,47,.08);border:1px solid rgba(35,39,47,.14);border-radius:7px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.tok-keyword{color:#7c3aed;font-weight:700}.tok-string{color:#0f766e}.tok-number{color:#b45309}.tok-comment{color:#6b7280;font-style:italic}
.richbody a{color:#225ea8;text-decoration:underline}
.sticky.search-miss{display:none}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 0;font-size:10px;color:rgba(35,39,47,.72)}
.meta span{padding:2px 6px;border:1px solid rgba(35,39,47,.2);border-radius:999px;background:rgba(255,255,255,.3)}
.meta .high{background:#ffd6d6;border-color:#d66}.meta .done{background:#d8f5df}.meta .blocked{background:#ffe9bd}.meta .next{background:#dbeafe}.meta .doing{background:#fef3c7}
::selection{background:rgba(255,243,163,.85)} /* 便利贴黄作为选区色，呼应主视觉 */
button:not(:disabled):focus-visible,select:focus-visible,input:focus-visible,[contenteditable=true]:focus-visible,
.sticky:focus-visible,.board:focus-visible,.pcell:focus-visible,.ov-item:focus-visible,.kan-card:focus-visible{outline:2.5px solid #2563eb;outline-offset:2px}
#viewMode{border:1px solid rgba(35,39,47,.2);border-radius:9px;padding:8px 6px;background:#fff;font:12px inherit}
#overview{position:fixed;inset:90px 24px 24px 280px;z-index:40;background:rgba(255,253,246,.97);border:1px solid rgba(35,39,47,.2);border-radius:14px;box-shadow:var(--shadow-lg);padding:22px;overflow:auto;display:none}
#overview.open{display:block}
/* 面板关闭按钮：兄弟选择器随 #overview.open 自动显隐，所有全屏面板共用 */
#ovClose{position:fixed;top:102px;right:36px;z-index:45;width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(35,39,47,.25);background:#fff;color:var(--ink);font-size:16px;line-height:1;
  cursor:pointer;display:none;box-shadow:var(--shadow)}
#overview.open ~ #ovClose{display:grid;place-items:center}
#ovClose:hover{background:#f3eee1}.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.ov-card{border:1px solid rgba(35,39,47,.15);border-radius:8px;padding:14px;background:#fff}.ov-card h3{margin:0 0 8px;font-size:14px}.ov-card strong{font-size:28px}.ov-list{display:grid;gap:6px}.ov-item{padding:8px;border-bottom:1px solid #eee;cursor:pointer;border-radius:7px;transition:background .12s}
.ov-item:hover{background:rgba(37,99,235,.07)}

#addBtn{
  border:0;border-radius:10px;background:#23272f;color:#fff;font-weight:700;
  font-size:13px;padding:9px 16px;cursor:pointer;white-space:nowrap;
}
#addBtn:hover{background:#000}
#palette{
  position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:70;
  width:min(480px,92vw);max-height:70vh;overflow-y:auto;
  background:rgba(255,253,246,.98);border:1.5px solid rgba(35,39,47,.85);
  border-radius:18px;box-shadow:var(--shadow-lg);padding:16px;display:none;
}
#palette.open{display:block}
#palette h4{margin:10px 2px 8px;font-size:12px;letter-spacing:.1em;color:var(--muted)}
#palette h4:first-child{margin-top:0}
.prow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pcell{
  border:1px solid rgba(35,39,47,.2);border-radius:10px;padding:10px 4px 8px;
  cursor:pointer;text-align:center;font-size:11px;font-weight:600;background:#fff;
}
.pcell:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcell .mini{height:44px;border-radius:6px;margin-bottom:6px;padding:6px 5px;
  font-family:"Caveat",cursive;font-size:15px;line-height:1.1;overflow:hidden;
  border:1px solid rgba(35,39,47,.12);text-align:left}
.pcell .mini i{display:block;height:5px;border-radius:3px;background:rgba(35,39,47,.25);margin:4px 2px}
.pcell .mini b{display:inline-block;width:12px;height:12px;border:1.5px solid rgba(35,39,47,.6);
  border-radius:3px;vertical-align:middle;margin-right:3px}
.sticky{
  position:absolute;width:320px;max-width:min(560px,calc(100vw - 300px));border-radius:4px 4px 12px 4px;
  padding:30px 12px 10px;transform:rotate(var(--rot,0deg));
  box-shadow:0 10px 18px -10px rgba(35,39,47,.35);
  border:1px solid rgba(35,39,47,.12);cursor:grab;
}
.sticky.sel{box-shadow:0 22px 36px -12px rgba(35,39,47,.45);z-index:50 !important;
  transform:rotate(var(--rot,0deg)) scale(1.03)}
.sticky.drag{cursor:grabbing;box-shadow:0 28px 44px -14px rgba(35,39,47,.5);z-index:100 !important}
.sticky::before{
  content:"";position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:74px;height:24px;background:rgba(255,255,255,.62);
  border-left:1px dashed rgba(35,39,47,.18);border-right:1px dashed rgba(35,39,47,.18);
  box-shadow:0 2px 5px rgba(35,39,47,.12);
}
.sticky h3{font-family:"Caveat",cursive;font-size:21px;line-height:1.05;margin:0 0 6px;
  outline:none;border-radius:4px}
.sticky h3:focus,.sticky p:focus,.ttext:focus{background:rgba(255,255,255,.55)}
.sticky p{font-size:12.5px;line-height:1.6;color:rgba(35,39,47,.8);margin:0;
  white-space:pre-line;outline:none;border-radius:4px;min-height:1em}
.sticky.titlekind{width:240px}
.sticky.titlekind h3{font-size:30px}
.sticky .del{
  position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
  border:1px solid rgba(35,39,47,.4);background:rgba(255,255,255,.8);cursor:pointer;
  font-size:12px;display:none;place-items:center;line-height:1;
}
.sticky:hover .del,.sticky.sel .del{display:grid}
.sticky .dots{display:none;gap:5px;margin-top:9px;padding-top:8px;
  border-top:1px dashed rgba(35,39,47,.25)}
.sticky.sel .dots{display:flex}
.dots button{width:18px;height:18px;border-radius:50%;cursor:pointer;
  border:1.5px solid rgba(35,39,47,.45);padding:0}
.dots button.on{outline:2px solid #23272f;outline-offset:1px}
.sticky ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.trow{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.45}
.tbox{flex:none;width:15px;height:15px;border-radius:4px;margin-top:1px;cursor:pointer;
  border:1.6px solid rgba(35,39,47,.7);background:rgba(255,255,255,.65);
  display:grid;place-items:center}
.trow.done .tbox{background:#23272f;border-color:#23272f}
.trow.done .tbox svg{opacity:1}
.tbox svg{opacity:0}
.trow.done .ttext{text-decoration:line-through;opacity:.55}
.ttext{flex:1;outline:none;border-radius:4px;min-height:1em;word-break:break-word}
.tx{border:0;background:transparent;cursor:pointer;opacity:0;color:var(--muted);font-size:12px;padding:0 2px}
.trow:hover .tx{opacity:1}
.tadd{width:100%;border:1px dashed rgba(35,39,47,.35);border-radius:8px;background:transparent;
  font-size:12px;padding:6px 8px;margin-top:7px;color:inherit;outline:none;font-family:inherit}
.tadd:focus{background:rgba(255,255,255,.55)}
.b-blue{background:var(--blue)} .b-pink{background:var(--pink)}
.b-green{background:var(--green)} .b-yellow{background:var(--yellow)}
.b-purple{background:var(--purple)} .b-cyan{background:var(--cyan)}
.b-white{background:#fdfdf8}
#ver{opacity:.55}

.sticky .rh{position:absolute;right:-11px;bottom:-11px;width:26px;height:26px;border-radius:50%;
  background:#fff;border:1.5px solid rgba(35,39,47,.6);cursor:grab;display:none;place-items:center;
  box-shadow:var(--shadow);color:#23272f}
.sticky:hover .rh,.sticky.sel .rh{display:grid}
.sticky .rh svg{display:block;pointer-events:none}
.sticky .rsz{position:absolute;left:-11px;bottom:-11px;width:26px;height:26px;border-radius:50%;
  background:#fff;border:1.5px solid rgba(35,39,47,.6);cursor:nesw-resize;display:none;place-items:center;
  box-shadow:var(--shadow);color:#23272f}
.sticky:hover .rsz,.sticky.sel .rsz{display:grid}
.sticky .rsz svg{display:block;pointer-events:none}
/* ---- dynamic-island dialog ---- */
#islandWrap{position:fixed;inset:0;display:none;justify-content:center;align-items:flex-start;
  padding-top:20vh;z-index:95;pointer-events:none}
#islandWrap.show{display:flex}
#island{pointer-events:auto;width:180px;height:36px;max-width:92vw;border-radius:22px;overflow:hidden;
  background:var(--card);color:var(--ink);border:1.5px solid rgba(35,39,47,.85);
  box-shadow:var(--shadow-lg)}
.island-inner{opacity:0;transition:opacity .25s;padding:20px 22px 18px;width:100%}
#island.ready .island-inner{opacity:1}
.isl-title{font-family:"Caveat",cursive;font-size:28px;margin-bottom:10px;text-align:center}
#islInput{width:100%;border:1.5px solid rgba(35,39,47,.5);background:#fff;color:var(--ink);
  border-radius:10px;padding:9px 11px;font-size:14px;outline:none;font-family:inherit;text-align:center}
#islInput:focus{border-color:var(--ink)}
#islInput::placeholder{color:#9ca3af}
.isl-btns{display:flex;gap:8px;margin-top:14px;justify-content:center}
.isl-btns button{border-radius:9px;padding:8px 22px;font-size:13px;font-weight:700;cursor:pointer}
#islOk{background:#23272f;color:#fff;border:1.5px solid #23272f}
#islOk:hover{background:#000}
#islCancel{background:#fff;color:var(--ink);border:1.5px solid rgba(35,39,47,.4)}
#islCancel:hover{background:#f3eee1}
.zoom{
  position:fixed;left:276px;bottom:16px;z-index:55;display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.94);border:1px solid rgba(35,39,47,.12);
  border-radius:12px;padding:4px;box-shadow:var(--shadow);font-size:13px;font-weight:600;
}
.zoom button{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
.zoom button:hover{background:#f1ede2}
.hint{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:45;
  background:rgba(35,39,47,.86);color:#fff;font-size:12px;padding:8px 34px 8px 14px;border-radius:999px;
  white-space:nowrap;display:none;
}

  ui.collapsed = false; applySide();
};
/* ---- 快捷键帮助：? 按钮常驻，前 3 次启动自动展示 ---- */
function toggleHelp(show) {
  const hint = document.getElementById("hint");
  const open = typeof show === "boolean" ? show : !hint.classList.contains("show");
  hint.classList.toggle("show", open);
}
document.getElementById("helpBtn").onclick = () => toggleHelp();
document.getElementById("hintClose").onclick = () => toggleHelp(false);
if (ui.hintBoots < 3) { ui.hintBoots += 1; persistUi(); toggleHelp(true); }
/* ---- init ---- */
if (!board().view) board().view = {x: 0, y: 0, k: 1};
applySide();
buildPalette();
renderBoards();
renderAll();
</script>
</body>
</html>
