<style>

}

.toolBtn:hover{background:#f3eee1}

.shape{position:absolute;border:2px solid #23272f;background:rgba(255,255,255,.35);border-radius:8px}.shape.ellipse{border-radius:50%}.connector{position:absolute;height:3px;background:#23272f;transform-origin:left center}.drawstroke{position:absolute;pointer-events:none}
.shape table{width:100%;height:100%;border-collapse:collapse;font-size:12px;background:rgba(255,255,255,.65)}.shape td{border:1px solid #777;padding:5px}.shape td[contenteditable=true]{background:#fff}
.selection-box{position:absolute;border:1px dashed #2563eb;background:rgba(37,99,235,.12);pointer-events:none;z-index:1000}.selected-outline,.shape.sel,.connector.sel,.drawstroke.sel{outline:3px solid #2563eb;outline-offset:3px}.connector .arrowhead{position:absolute;right:-2px;top:-8px;font-size:20px}.crop-preview{max-width:100%;max-height:60vh;object-fit:contain}.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.plan-grid textarea{width:100%;min-height:110px;padding:9px;border:1px solid #ccd1d8;border-radius:8px;font:12px inherit}.goal{border:1px solid #ddd;border-radius:9px;padding:11px;background:#fff;margin:8px 0}.goal .bar{height:7px;background:#eee;border-radius:999px;overflow:hidden}.goal .bar i{display:block;height:100%;background:#4d9f70}.trend{display:flex;align-items:flex-end;gap:5px;height:130px;padding:8px;border-bottom:1px solid #ccc}.trend i{display:block;flex:1;background:#91b8e8;min-height:3px;border-radius:4px 4px 0 0;position:relative}.trend i b{position:absolute;bottom:-18px;left:50%;font-size:9px;transform:translateX(-50%);font-weight:400}
.goal-head{display:flex;align-items:center;gap:5px;margin-bottom:7px}.goal-head input{flex:1;font-weight:700}.goal-head select{width:auto;padding:5px}.goal label{display:block;margin-top:7px}.goal textarea{width:100%;box-sizing:border-box;resize:vertical;padding:6px;border:1px solid #ccd1d8;border-radius:6px;font:11px inherit}.goal [data-goal-save]{margin-top:7px;padding:6px 9px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;cursor:pointer}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:5px}.cal-weekday{text-align:center;font-size:11px;color:var(--muted);padding:5px}.cal-cell{min-height:82px;border:1px solid #ddd;border-radius:7px;background:#fff;padding:6px}.cal-cell.muted{background:transparent;border-color:transparent}.cal-task{display:block;width:100%;margin-top:5px;padding:4px;border:0;border-radius:5px;background:#e9f0ff;color:#1d4ed8;text-align:left;font-size:10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tok-keyword{color:#7c3aed;font-weight:700}.tok-string{color:#0f766e}.tok-number{color:#b45309}.tok-comment{color:#6b7280;font-style:italic}

.sticky.search-miss{display:none}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 0;font-size:10px;color:rgba(35,39,47,.72)}
.meta span{padding:2px 6px;border:1px solid rgba(35,39,47,.2);border-radius:999px;background:rgba(255,255,255,.3)}
.meta .urgent,.meta .high{background:#ffd6d6;border-color:#d66}.meta .done{background:#d8f5df}.meta .blocked{background:#ffe9bd}
#viewMode,#statusFilter,#priorityFilter,#tagFilter{border:1px solid rgba(35,39,47,.2);border-radius:9px;padding:8px 6px;background:#fff;font:12px inherit}

#overview.open{display:block}.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.ov-card{border:1px solid rgba(35,39,47,.15);border-radius:8px;padding:14px;background:#fff}.ov-card h3{margin:0 0 8px;font-size:14px}.ov-card strong{font-size:28px}.ov-list{display:grid;gap:6px}.ov-item{padding:8px;border-bottom:1px solid #eee;cursor:pointer}
#addBtn{

}

#palette{
  position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:70;

.prow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pcell{
  border:1px solid rgba(35,39,47,.2);border-radius:10px;padding:10px 4px 8px;

.sticky{
  position:absolute;width:320px;max-width:min(560px,calc(100vw - 300px));border-radius:4px 4px 12px 4px;
  padding:30px 12px 10px;transform:rotate(var(--rot,0deg));
  box-shadow:0 10px 18px -10px rgba(35,39,47,.35);
  border:1px solid rgba(35,39,47,.12);cursor:grab;
}
.sticky.sel{box-shadow:0 22px 36px -12px rgba(35,39,47,.45);z-index:50;
  transform:rotate(var(--rot,0deg)) scale(1.03)}
.sticky.drag{cursor:grabbing;box-shadow:0 28px 44px -14px rgba(35,39,47,.5);z-index:100}
.sticky::before{
  content:"";position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:74px;height:24px;background:rgba(255,255,255,.62);
  border-left:1px dashed rgba(35,39,47,.18);border-right:1px dashed rgba(35,39,47,.18);
  box-shadow:0 2px 5px rgba(35,39,47,.12);

.trow{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.45}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { palette.classList.remove("open"); closeIsland(); activeTool = null; selectionMode = false; document.querySelectorAll("[data-tool],#arrangeGroup [data-op=select]").forEach(button => button.classList.remove("active")); }
  if ((e.key === "Delete" || e.key === "Backspace") && !e.target.isContentEditable && !["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) && (selectedIds.size || selectedElementIds.size)) { e.preventDefault(); board().stickies.forEach(st => { if (selectedIds.has(st.id)) st.trashed = true; }); board().elements = (board().elements || []).filter(elm => !selectedElementIds.has(elm.id)); selectedIds.clear(); selectedElementIds.clear(); save(); renderAll(); document.getElementById("inspector").style.display = "none"; showToast("已移到回收站"); }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && !e.target.isContentEditable && e.target.tagName !== "INPUT") { e.preventDefault(); undo(); }
});
/* ---- sidebar collapse (persisted) ---- */
const UIKEY = "stickyboard-ui-v1";
let ui = {collapsed: false};
try {
  const u = JSON.parse(localStorage.getItem(UIKEY));
  if (u && typeof u.collapsed === "boolean") ui = u;
} catch (e) {}
function applySide() {
  document.body.classList.toggle("side-hidden", ui.collapsed);
  try { localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch (e) {}
}
document.getElementById("collapseBtn").onclick = e => {
  e.stopPropagation(); ui.collapsed = true; applySide();
};
document.getElementById("sideTab").onclick = () => {
  ui.collapsed = false; applySide();
};
/* ---- init ---- */
if (!board().view) board().view = {x: 300, y: 80, k: 1};
applySide();
buildPalette();
renderBoards();
renderAll();
checkReminders();
</script>
</body>
</html>
